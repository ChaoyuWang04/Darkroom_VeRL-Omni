# AppLovin placement specs — v0
#
# In-app interstitials render edge to edge with a close button in one corner.
# Chrome is lighter than social feeds, but the close-button corner must stay
# clear, which is why the logo anchor avoids top_right here.
platform: applovin
source: "AppLovin creative spec sheet (public), read 2026-08-18"
version: "2026Q3.0"
valid_to: 2026-11-30

sizes:
  - size: 1080x1080
    safe_zone: {top: 100, bottom: 40, left: 40, right: 40}
    text_max_ratio: 0.25
    required_elements: [product, cta]
    logo: {anchor: top_left, min_size_pct: 0.05}

  - size: 1080x1920
    safe_zone: {top: 120, bottom: 200, left: 50, right: 50}
    text_max_ratio: 0.25
    required_elements: [product, cta]
    logo: {anchor: top_left, min_size_pct: 0.05}

  - size: 1920x1080
    safe_zone: {top: 100, bottom: 40, left: 40, right: 40}
    text_max_ratio: 0.25
    required_elements: [product, cta]
    logo: {anchor: bottom_left, min_size_pct: 0.04}
